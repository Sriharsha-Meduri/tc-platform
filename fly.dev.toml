# Fly.io config for the TC NestJS API — DEV environment
# Deploy: fly deploy --config fly.dev.toml

app = "tc-api-dev"
primary_region = "sjc"

[build]
  dockerfile = "apps/api/Dockerfile"

[env]
  NODE_ENV = "production"
  APP_ENV  = "dev"
  PORT     = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
